[build-system]
requires = ["hatchling>=1.11,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-bot-habr"
version = "0.1.0"
description = "Telegram bot for Habr article processing"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["telegram", "habr", "bot"]

dependencies = [
    "aiohappyeyeballs==2.6.2",
    "aiohttp==3.14.1",
    "aiosignal==1.4.0",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "multidict==6.7.1",
    "nats-py==2.15.0",
    "propcache==0.5.2",
    "python-memcached==1.62",
    "python-telegram-bot==22.8",
    "requests==2.34.2",
    "soupsieve==2.8.4",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
    "yarl==1.24.2",
]
