[build-system]
requires = ["hatchling>=1.11,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-bot-habr"
version = "0.1.0"
description = "Telegram bot for Habr article processing"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
keywords = ["telegram", "habr", "bot"]

dependencies = [
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.5",
    "aiosignal>=1.4.0",
    "anyio>=4.15.1",
    "attrs>=26.1.0",
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.23",
    "charset-normalizer>=3.5.2",
    "frozenlist>=1.8.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.20",
    "multidict>=7.2.1",
    "nats-py>=2.16.0",
    "propcache>=0.5.4",
    "python-memcached>=1.62",
    "aiogram>=3.31.0",
    "requests>=2.34.2",
    "soupsieve>=3.0.4",
    "typing-extensions>=4.16.0",
    "urllib3>=2.8.0",
    "yarl>=1.25.1",
]
